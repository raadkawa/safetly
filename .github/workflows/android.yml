name: Android (APK og Google Play)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg nettappen
        run: npm run build

      - name: Lag Android-prosjekt
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Android-appen henter innholdet fra nettappen (alle får nye versjoner uten ny app),
          # og viser www/offline.html med nødnumrene uten nett.
          node scripts/native-setup.mjs config android
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1C1A16' --iconBackgroundColorDark '#1C1A16' \
            --splashBackgroundColor '#F6F0E4' --splashBackgroundColorDark '#16140F'
          npx cap sync android
          node scripts/native-setup.mjs android

      - name: Bygg test-APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Bygg signert app for Google Play (AAB) og APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/safetly.jks"
          ALIAS="${KEY_ALIAS:-safetly}"; KPW="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/safetly.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KPW"
          rm -f "$RUNNER_TEMP/safetly.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: safetly-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
