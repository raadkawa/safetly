name: Varslingstjeneste (Supabase)

# Installerer varslingstjenesten (supabase/functions/push) i Supabase.
# Krever secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions),
# laget på https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/supabase.yml']
  # Kjør også manuelt (Actions → Varslingstjeneste → Run workflow) etter at nye nøkler er lagt inn.
  workflow_dispatch:

env:
  PROJECT_REF: ptbyychbijspnchxtkzd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk nøkkel
        id: c
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Legg inn SUPABASE_ACCESS_TOKEN som secret for å installere varslingstjenesten."; fi
      - uses: actions/checkout@v5
        if: steps.c.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.c.outputs.ready == 'true'
        with:
          version: latest
      - name: Nøkler for varsler i appene (Android og iPhone)
        if: steps.c.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          ARGS=()
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then ARGS+=("FIREBASE_SERVICE_ACCOUNT=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -c .)"); fi
          if [ -n "$APNS_KEY_P8" ] && [ -n "$APNS_KEY_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            ARGS+=("APNS_KEY_P8=$(printf '%s' "$APNS_KEY_P8" | tr '\n' ' ')" "APNS_KEY_ID=$APNS_KEY_ID" "APPLE_TEAM_ID=$APPLE_TEAM_ID")
          fi
          if [ ${#ARGS[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${ARGS[@]}"; echo "Nøkler for app-varsler er lagt inn."; else echo "Ingen nøkler for app-varsler ennå."; fi
      - name: Installer varslingstjenesten
        if: steps.c.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy push --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Sjekk at den svarer
        if: steps.c.outputs.ready == 'true'
        run: |
          sleep 5
          curl -sS -f -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push" -H 'Content-Type: application/json' -d '{"type":"public-key"}' | grep -q publicKey && echo "Varslingstjenesten svarer."
